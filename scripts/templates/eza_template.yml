# Generated by axiom (scripts/theme_eza.sh) from the "${THEME_NAME}" theme.
# Rewritten on every theme change: edit the template instead.
colourful: true

filekinds:
  normal: {foreground: "${FOREGROUND}"}
  directory: {foreground: "${ACCENT}", is_bold: true}
  symlink: {foreground: "${CYAN}"}
  pipe: {foreground: "${YELLOW}"}
  block_device: {foreground: "${YELLOW}", is_bold: true}
  char_device: {foreground: "${YELLOW}", is_bold: true}
  socket: {foreground: "${MAGENTA}", is_bold: true}
  special: {foreground: "${YELLOW}"}
  executable: {foreground: "${GREEN}", is_bold: true}
  mount_point: {foreground: "${ACCENT}", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "${YELLOW}", is_bold: true}
  user_write: {foreground: "${RED}", is_bold: true}
  user_execute_file: {foreground: "${GREEN}", is_bold: true, is_underline: true}
  user_execute_other: {foreground: "${GREEN}", is_bold: true}
  group_read: {foreground: "${YELLOW}"}
  group_write: {foreground: "${RED}"}
  group_execute: {foreground: "${GREEN}"}
  other_read: {foreground: "${YELLOW}"}
  other_write: {foreground: "${RED}"}
  other_execute: {foreground: "${GREEN}"}
  special_user_file: {foreground: "${MAGENTA}"}
  special_other: {foreground: "${MAGENTA}"}
  attribute: {foreground: "${FOREGROUND_ALT}"}

# Bigger is louder
size:
  major: {foreground: "${GREEN}", is_bold: true}
  minor: {foreground: "${GREEN}"}
  number_byte: {foreground: "${FOREGROUND_ALT}"}
  number_kilo: {foreground: "${FOREGROUND}"}
  number_mega: {foreground: "${GREEN}"}
  number_giga: {foreground: "${YELLOW}"}
  number_huge: {foreground: "${RED}"}
  unit_byte: {foreground: "${FOREGROUND_ALT}"}
  unit_kilo: {foreground: "${FOREGROUND}"}
  unit_mega: {foreground: "${GREEN}"}
  unit_giga: {foreground: "${YELLOW}"}
  unit_huge: {foreground: "${RED}"}

users:
  user_you: {foreground: "${YELLOW}", is_bold: true}
  user_root: {foreground: "${RED}", is_bold: true}
  user_other: {foreground: "${FOREGROUND}"}
  group_yours: {foreground: "${YELLOW}"}
  group_other: {foreground: "${FOREGROUND}"}
  group_root: {foreground: "${RED}"}

links:
  normal: {foreground: "${RED}", is_bold: true}
  multi_link_file: {foreground: "${RED}", background: "${BACKGROUND_HIGHLIGHT}"}

git:
  new: {foreground: "${GREEN}"}
  modified: {foreground: "${ACCENT}"}
  deleted: {foreground: "${RED}"}
  renamed: {foreground: "${YELLOW}"}
  typechange: {foreground: "${MAGENTA}"}
  ignored: {foreground: "${ANSI_8}"}
  conflicted: {foreground: "${RED}", is_bold: true}

git_repo:
  branch_main: {foreground: "${GREEN}"}
  branch_other: {foreground: "${YELLOW}"}
  git_clean: {foreground: "${GREEN}"}
  git_dirty: {foreground: "${YELLOW}"}

security_context:
  colon: {foreground: "${ANSI_8}"}
  user: {foreground: "${FOREGROUND}"}
  role: {foreground: "${MAGENTA}"}
  typ: {foreground: "${ANSI_8}"}
  range: {foreground: "${MAGENTA}"}

file_type:
  image: {foreground: "${MAGENTA}"}
  video: {foreground: "${MAGENTA}", is_bold: true}
  music: {foreground: "${CYAN}"}
  lossless: {foreground: "${CYAN}", is_bold: true}
  crypto: {foreground: "${GREEN}", is_bold: true}
  document: {foreground: "${FOREGROUND}"}
  compressed: {foreground: "${RED}"}
  temp: {foreground: "${ANSI_8}"}
  compiled: {foreground: "${YELLOW}"}
  build: {foreground: "${YELLOW}", is_bold: true, is_underline: true}
  source: {foreground: "${YELLOW}", is_bold: true}

punctuation: {foreground: "${ANSI_8}"}
date: {foreground: "${ACCENT_ALT}"}
inode: {foreground: "${MAGENTA}"}
blocks: {foreground: "${CYAN}"}
header: {foreground: "${FOREGROUND}", is_underline: true}
octal: {foreground: "${MAGENTA}"}
flags: {foreground: "${FOREGROUND_ALT}"}
control_char: {foreground: "${RED}"}
broken_symlink: {foreground: "${RED}"}
broken_path_overlay: {is_underline: true}
