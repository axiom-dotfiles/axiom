body:
  - type: markdown
    attributes:
      value: |
        Show off your setup: bars, pages, edge menus, themes, anything you built with axiom.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images or a short video in here.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: About it
      description: The theme, the compositor, what you're proud of, and anything that took some figuring out.
  - type: textarea
    id: export
    attributes:
      label: Your config, to try
      description: Optional. **Settings → Maintenance → Share → Export** writes your look and layout to a file holding only what differs from the defaults, never your monitors, wallpapers, accounts or paths. Attach that file (or paste it in), and others can load it with **Import…**.
