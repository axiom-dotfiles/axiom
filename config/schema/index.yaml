# The root of the config schema. `axiom schema build` joins it, the sections
# (sections/<Name>.yaml, in the order `sections` lists them, after `properties`)
# and the definitions (definitions/**/<Name>.yaml) into config/json/config.schema.json.

$schema: http://json-schema.org/draft-07/schema#
title: Axiom Configuration Schema
description: 'Source of truth for config.json ($XDG_CONFIG_HOME/axiom/config.json). Every key''s `default` is filled in at load time (SchemaValidation.applyDefaults), so config readers never need their own fallbacks. `title`/`description`/`minimum`/`maximum`/`enum` drive the generated settings UI; `x-settings: false` hides a key from it (edited elsewhere, or UI-owned state); `x-options` names a dynamic option list ("screens", "chatProviders" and "chatPresets", "colors" for the 16 base theme colors, "languages" from config/i18n, "cursorThemes" for installed cursor themes, "timezones" for the system''s time zones, "edgeMenus" for the ids of EdgeMenus); `x-showIf` ({ sibling: value | [values] | { not: value } }) hides a field unless a sibling matches; a key starting with `/` is a dotted path from the config root instead ("/Workspaces.layout"). `x-enumLabels` ({ value: label }) shows labels instead of raw enum values in dropdowns. `x-multiline: true` edits a string in a growing text area. `x-categories` at the root lists the settings sidebar''s categories in order, each `{ name, icon, page }` (`page`: a hand-built part after its cards, `views/settings/<page>.qml`); sections join one with `x-category`. `x-libraryGroups` at the root lists, in order, the groups the bar editor''s and layouts editor''s libraries sort their types into (by category); each bar widget and overlay module definition joins one with `x-libraryGroup`. `x-cardPerField: true` on a section makes each of its direct fields a settings card of its own. `x-beside: true` on a field puts it beside the field before it on its settings card, each taking half the width. `x-order` on an object schema lists the keys its form shows first, in order (a schema reaches QML as a map, whose keys come out sorted). `x-defaultSize` ([w, h] in grid units, four to a card) on an overlay module definition is the size it''s added at, and `x-minSize` the least a drop into a gap shrinks it to (half the default when left out); `x-icon` on a module or view definition is its Material Symbols icon name in the editor. `x-hosts` on a module definition lists where it may be placed ("overlay", "edgeMenu", "lockscreen", "greeter", "desktop"; the first two when left out, so the lock screen, the greeter and the desktop only take modules that list them). `x-greeter: true` on a Hyprland.managed option carries it to the greeter (its Hyprland takes the option in managed mode). A `$ref` may carry keys beside it (`default`, `title`, …), which override the definition''s. `x-required: true` on one makes it part of every grid on its hosts: it can''t be removed or duplicated, and the library doesn''t offer it. `x-canvasDetail` names a module property the layouts editor shows on its tile (a list joined), and `x-canvasFill` a color property the tile is filled with. `x-snapshot: true` marks a machine setting a saved snapshot carries too, since it restores on the PC it was saved on (the wallpaper setup: ConfigExamples.snapshot); a `file://` URL in it comes back only while its file exists. `x-takeover: true` marks a setting that takes something over on this PC (the Hyprland mode, the lock screen, idle, polkit, the greeter): loading a saved config, the defaults, an example or an import keeps its current value (ConfigExamples.keepTakeovers). Bar widgets are a oneOf discriminated by `type`, and get their `properties` defaults filled like everything else.'
type: object
x-categories:
  - {name: General, icon: home}
  - {name: Look & Feel, icon: palette}
  - {name: Compositor, icon: desktop_windows}
  - {name: Workspaces, icon: grid_view}
  - {name: Overlay & Popouts, icon: layers}
  - {name: Dock & OSD, icon: dock_to_bottom}
  - {name: Launcher, icon: rocket_launch}
  - {name: Notifications, icon: notifications}
  - {name: Screen & Power, icon: power_settings_new}
  - {name: Calendar, icon: calendar_month}
  - {name: Modules, icon: widgets}
  - {name: Theme integrations, icon: format_paint}
  - name: Maintenance
    icon: build
    card: SavedConfigs
    cardTitle: Saved configurations
x-libraryGroups:
  - Desktop
  - Time & weather
  - Media & audio
  - Network & devices
  - System
  - Tools
  - Look & layout
  - Session
additionalProperties: false
properties:
  $schema:
    type: string
    x-settings: false
  version:
    type: integer
    default: 75
    description: Config format version, used for automatic migration.
    x-settings: false
