# The ClaudeUsageWidget definition (#/definitions/ClaudeUsageWidget).

x-link: {setting: ClaudeUsage}
type: object
x-icon: data_usage
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  type:
    const: ClaudeUsage
    description: Claude Usage
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    x-order: [metric, display]
    properties:
      metric:
        type: string
        title: Limit shown
        default: session
        enum: [session, weekly]
        x-enumLabels: {session: Current session, weekly: Weekly}
      display:
        type: string
        title: Accounts shown
        default: max
        enum: [max, all, first]
        x-enumLabels: {max: Fullest, all: All, first: First}
        description: Which account's usage the bar shows. The popout lists every account.
      icon:
        type: string
        title: Icon
        default: data_usage
        description: A Material Symbols name (fonts.google.com/icons), or text.
      warnThreshold:
        type: integer
        title: Warning at
        x-unit: '%'
        default: 75
        minimum: 1
        maximum: 100
      criticalThreshold:
        type: integer
        title: Critical at
        x-unit: '%'
        default: 90
        minimum: 1
        maximum: 100
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: List every limit per account when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      clickCommand:
        x-scope: commands
        type: string
        title: Click command
        default: ""
        description: Run on left click (e.g. `xdg-open https://claude.ai/settings/usage`). Right click checks again now.
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      warnColor:
        type: string
        title: Warning color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: warning
        x-showIf:
          $bar.widgetStyle: {not: plain}
      criticalColor:
        type: string
        title: Critical color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: critical
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
