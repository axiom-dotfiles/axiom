# The StopwatchWidget definition (#/definitions/StopwatchWidget).

x-link: {setting: Stopwatch}
type: object
x-icon: timer_play
x-libraryGroup: Tools
required: [type]
additionalProperties: false
properties:
  type:
    const: Stopwatch
    description: Timer & stopwatch
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      hideWhenIdle:
        type: boolean
        title: Hide when stopped
        default: false
        description: Show only while the timer or stopwatch runs or is paused (start one from the launcher's /timer or /stopwatch, or a module).
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: The timer and stopwatch, to set and start, when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      timerColor:
        type: string
        title: Timer color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      stopwatchColor:
        type: string
        title: Stopwatch color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: alt
        x-showIf:
          $bar.widgetStyle: {not: plain}
      idleColor:
        type: string
        title: Stopped color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: "off"
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
