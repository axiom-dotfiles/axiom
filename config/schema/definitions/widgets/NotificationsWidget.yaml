# The NotificationsWidget definition (#/definitions/NotificationsWidget).

x-link: {setting: Notifications}
type: object
x-icon: notifications
x-libraryGroup: Desktop
required: [type]
additionalProperties: false
properties:
  type:
    const: Notifications
    description: Notification Center
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showCount:
        type: boolean
        title: Show count
        default: true
        description: Badge with the number of notifications.
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: Open the notification list when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
      dndColor:
        type: string
        title: Do-not-disturb icon
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: "off"
      badgeColor:
        type: string
        title: Badge
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: critical
