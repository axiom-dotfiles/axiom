# The SeparatorWidget definition (#/definitions/SeparatorWidget).

type: object
x-icon: more_vert
x-libraryGroup: Look & layout
required: [type]
additionalProperties: false
properties:
  type:
    const: Separator
    description: Separator / Spacer
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      style:
        type: string
        title: Style
        default: line
        enum: [line, dot, slash, chevron, space]
      size:
        type: integer
        title: Size
        default: 12
        minimum: 0
        maximum: 500
        x-unit: px
        description: Space it takes along the bar (px).
      thickness:
        type: integer
        x-control: stepper
        title: Thickness
        default: 2
        minimum: 1
        maximum: 10
        x-unit: px
        description: Line width (px); dots are twice this across.
        x-showIf:
          style: {not: space}
      length:
        type: integer
        title: Line length
        x-unit: '%'
        default: 60
        minimum: 10
        maximum: 100
        description: Share of the widget height the line, slash or chevron spans.
        x-showIf:
          style: [line, slash, chevron]
      color:
        type: string
        title: Color
        x-options: colors
        default: base03
        x-showIf:
          style: {not: space}
