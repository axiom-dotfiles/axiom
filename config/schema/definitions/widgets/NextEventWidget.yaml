# The NextEventWidget definition (#/definitions/NextEventWidget).

x-link: {setting: Calendar}
type: object
x-icon: event
x-libraryGroup: Time & weather
required: [type]
additionalProperties: false
properties:
  type:
    const: NextEvent
    description: Next Event
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      lookahead:
        type: integer
        title: Look ahead
        x-unit: min
        default: 720
        minimum: 15
        maximum: 10080
        description: Shows the next event starting within this long (or happening now). Hidden when there's none.
      showAllDay:
        type: boolean
        title: All-day events
        default: false
        description: Count all-day events as the next event.
      maxLength:
        type: integer
        x-control: stepper
        title: Title length
        default: 24
        minimum: 4
        maximum: 100
        description: Longest title shown before it is shortened (characters).
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: Open the calendar when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
