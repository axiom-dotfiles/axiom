# The NetworkWidget definition (#/definitions/NetworkWidget).

type: object
x-icon: wifi
x-libraryGroup: Network & devices
required: [type]
additionalProperties: false
properties:
  type:
    const: Network
    description: Network Status
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showName:
        type: boolean
        title: Show device
        default: false
        description: Show the connected device name next to the icon.
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: Open the Wi-Fi menu when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      middleCommand:
        x-scope: commands
        type: string
        title: Middle-click command
        default: ""
        description: Shell command run on middle click (e.g. nm-connection-editor). Empty does nothing.
      backgroundColor:
        type: string
        title: Connected color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      disconnectedColor:
        type: string
        title: Disconnected color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: critical
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
