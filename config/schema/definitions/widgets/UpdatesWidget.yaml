# The UpdatesWidget definition (#/definitions/UpdatesWidget).

x-link: {setting: Updates}
type: object
x-icon: package_2
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  type:
    const: Updates
    description: Package Updates
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      intervalMinutes:
        type: integer
        title: Check interval
        x-unit: min
        default: 30
        minimum: 5
        maximum: 1440
      hideWhenEmpty:
        type: boolean
        title: Hide when up to date
        default: true
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: List pending packages when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      manyThreshold:
        type: integer
        title: Many updates
        default: 50
        minimum: 1
        maximum: 1000
        description: At or above this count, the widget uses the many-updates background.
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      manyColor:
        type: string
        title: Many-updates color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: warning
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
