# The SystemStatsWidget definition (#/definitions/SystemStatsWidget).

type: object
x-icon: memory_alt
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  type:
    const: SystemStats
    description: System Stats
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showCpu:
        type: boolean
        title: CPU usage
        default: true
      showMemory:
        type: boolean
        title: Memory
        default: true
      memoryFormat:
        type: string
        title: Memory format
        default: percent
        enum: [percent, used]
        description: Percentage of RAM in use, or GiB used.
        x-showIf: {showMemory: true}
      showTemp:
        type: boolean
        title: CPU temperature
        default: true
        description: Hidden on machines without a k10temp / coretemp / zenpower sensor.
      showGpu:
        type: boolean
        title: GPU usage
        default: false
        description: AMD (sysfs) or NVIDIA (nvidia-smi). Hidden when no GPU is found.
      showDisk:
        type: boolean
        title: Disk usage
        default: false
      diskPath:
        x-scope: machine
        type: string
        title: Disk path
        x-control: folder
        default: /
        description: Any path on the filesystem to report.
        x-showIf: {showDisk: true}
      interval:
        type: integer
        title: Poll interval
        x-unit: ms
        default: 2000
        minimum: 1000
        maximum: 60000
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: Open live graphs of the shown metrics when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      warnThreshold:
        type: integer
        title: Warning at
        default: 90
        minimum: 1
        maximum: 100
        description: Any usage (%) or temperature (°C) at or above this switches to the warning background.
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      warnColor:
        type: string
        title: Warning color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: warning
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
