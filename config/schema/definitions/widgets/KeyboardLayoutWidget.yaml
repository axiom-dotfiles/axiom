# The KeyboardLayoutWidget definition (#/definitions/KeyboardLayoutWidget).

x-link: {setting: Input.kbLayout}
type: object
x-icon: keyboard
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  type:
    const: KeyboardLayout
    description: Keyboard Layout
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        title: Format
        default: short
        enum: [short, full]
        description: Layout code (US) or full keymap name (English (US)).
      hideSingle:
        type: boolean
        title: Hide single layout
        default: false
        description: Hide the widget when only one layout is configured.
      showPopout:
        type: boolean
        title: Menu popout
        default: false
        description: Open an edge menu when hovered.
      popoutMenu:
        type: string
        title: Menu
        default: ""
        x-options: edgeMenus
        x-emptyLabel: None
        description: The edge menu to open.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
