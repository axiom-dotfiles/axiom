# The BluetoothWidget definition (#/definitions/BluetoothWidget).

type: object
x-icon: bluetooth
x-libraryGroup: Network & devices
required: [type]
additionalProperties: false
properties:
  type:
    const: Bluetooth
    description: Bluetooth
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showDevice:
        type: boolean
        title: Show device
        default: true
        description: Show the connected device name (or count) next to the icon.
      showBattery:
        type: boolean
        title: Show battery
        default: true
        description: Append the connected device's battery level, when it reports one.
        x-showIf: {showDevice: true}
      hideWhenOff:
        type: boolean
        title: Hide when off
        default: false
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: Open the Bluetooth menu when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      middleCommand:
        x-scope: commands
        type: string
        title: Middle-click command
        default: ""
        description: Shell command run on middle click (e.g. blueman-manager). Empty does nothing.
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      connectedColor:
        type: string
        title: Connected color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: alt
        x-showIf:
          $bar.widgetStyle: {not: plain}
      disabledColor:
        type: string
        title: Off color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: "off"
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
