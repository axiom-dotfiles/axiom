# The BatteryWidget definition (#/definitions/BatteryWidget).

x-link: {setting: Battery}
type: object
x-icon: battery_full
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  type:
    const: Battery
    description: Battery Status
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showPercentage:
        type: boolean
        title: Show percentage
        default: true
      showPopout:
        type: boolean
        title: Menu popout
        default: false
        description: Open an edge menu when hovered.
      popoutMenu:
        type: string
        title: Menu
        default: ""
        x-options: edgeMenus
        x-emptyLabel: None
        description: The edge menu to open.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      chargingColor:
        type: string
        title: Charging color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: alt
        x-showIf:
          $bar.widgetStyle: {not: plain}
      lowColor:
        x-link: {setting: Battery.lowThreshold}
        type: string
        title: Low color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: warning
        description: At or below Battery > Low at (in settings).
        x-showIf:
          $bar.widgetStyle: {not: plain}
      criticalColor:
        x-link: {setting: Battery.criticalThreshold}
        type: string
        title: Critical color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: critical
        description: At or below Battery > Critical at (in settings).
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
