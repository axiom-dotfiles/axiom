# The PomodoroWidget definition (#/definitions/PomodoroWidget).

x-link: {setting: Pomodoro}
type: object
x-icon: timer
x-libraryGroup: Tools
required: [type]
additionalProperties: false
properties:
  type:
    const: Pomodoro
    description: Pomodoro timer
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      hideWhenIdle:
        type: boolean
        title: Hide when stopped
        default: false
        description: Show only while a session or break is on (start one from the launcher's /pomodoro or a module).
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: The timer's controls when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      workColor:
        type: string
        title: Focus color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      breakColor:
        type: string
        title: Break color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: alt
        x-showIf:
          $bar.widgetStyle: {not: plain}
      idleColor:
        type: string
        title: Stopped color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: "off"
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
