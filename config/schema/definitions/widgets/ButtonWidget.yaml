# The ButtonWidget definition (#/definitions/ButtonWidget).

type: object
x-icon: terminal
x-libraryGroup: Tools
required: [type]
additionalProperties: false
properties:
  type:
    const: Button
    description: Button / Command
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      icon:
        type: string
        title: Icon
        default: apps
        description: 'Icon shown on the button: a Material Symbols name (fonts.google.com/icons), or text.'
      label:
        type: string
        title: Label
        default: ""
        description: Text next to the icon. Replaced by the label command's output when that is set.
      tooltip:
        type: string
        title: Tooltip
        default: ""
        description: Shown when hovering the button.
      action:
        type: string
        title: Click action
        default: powerMenu
        description: What a left click does.
        enum:
          - powerMenu
          - appLauncher
          - overlay
          - overlayPage
          - workspaceOverlay
          - edgeMenu
          - lock
          - command
          - none
      page:
        type: string
        title: Overlay page
        default: ""
        description: The page the button opens the overlay on.
        x-options: overlayPages
        x-showIf: {action: overlayPage}
      menu:
        type: string
        title: Edge menu
        default: ""
        description: 'The edge menu a click opens and closes, as a full menu: hovering another widget''s popout doesn''t replace it.'
        x-options: edgeMenus
        x-showIf: {action: edgeMenu}
      command:
        x-scope: commands
        type: string
        title: Command
        default: ""
        description: Shell command run on left click.
        x-showIf: {action: command}
      rightCommand:
        x-scope: commands
        type: string
        title: Right-click command
        default: ""
        description: Shell command run on right click. Empty does nothing.
      middleCommand:
        x-scope: commands
        type: string
        title: Middle-click command
        default: ""
        description: Shell command run on middle click. Empty does nothing.
      hoverActivate:
        type: boolean
        title: Activate on hover
        default: false
        description: Run the click action after hovering for the popout open delay. Doesn't close a launcher, overlay or power menu that is already open. For an edge menu on hover, use Hover popout.
        x-showIf:
          action:
            - powerMenu
            - appLauncher
            - overlay
            - overlayPage
            - workspaceOverlay
            - lock
            - command
      showPopout:
        type: boolean
        title: Hover popout
        default: false
        description: 'Open an edge menu while the button is hovered, like other widgets'' popouts: it closes when the pointer leaves, and a neighbouring popout replaces it. Separate from the click action.'
      popoutMenu:
        type: string
        title: Popout menu
        default: ""
        x-options: edgeMenus
        description: The edge menu shown on hover. It can differ from the one a click opens.
        x-showIf: {showPopout: true}
      labelCommand:
        x-scope: commands
        type: string
        title: Label command
        default: ""
        description: Shell command whose first line of output is shown as the label, re-run on an interval.
      labelInterval:
        type: integer
        title: Label interval
        x-unit: ms
        default: 5000
        minimum: 500
        maximum: 3600000
        description: How often the label command runs.
        x-showIf:
          labelCommand: {not: ""}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
