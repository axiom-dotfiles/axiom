# The TodoWidget definition (#/definitions/TodoWidget).

x-link: {setting: Todo}
type: object
x-icon: checklist
x-libraryGroup: Tools
required: [type]
additionalProperties: false
properties:
  type:
    const: Todo
    description: Todo list
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      hideWhenEmpty:
        type: boolean
        title: Hide when nothing is open
        default: false
      showPopout:
        type: boolean
        title: Popout
        default: true
        description: The list, to add to and tick off, when hovered.
      popoutMenu:
        type: string
        title: Open instead
        default: ""
        x-options: edgeMenus
        x-emptyLabel: Its own popout
        description: An edge menu to open in place of the popout.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
