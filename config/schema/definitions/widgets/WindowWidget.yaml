# The WindowWidget definition (#/definitions/WindowWidget).

type: object
x-icon: wrap_text
x-libraryGroup: Desktop
required: [type]
additionalProperties: false
properties:
  type:
    const: Window
    description: Window Title
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      icon:
        type: string
        title: Icon
        default: ""
        description: 'Icon shown before the title: a Material Symbols name (fonts.google.com/icons), or text. Empty shows none.'
      emptyText:
        type: string
        title: Empty text
        default: —
        description: Shown when no window is focused.
      showPopout:
        type: boolean
        title: Menu popout
        default: false
        description: Open an edge menu when hovered.
      popoutMenu:
        type: string
        title: Menu
        default: ""
        x-options: edgeMenus
        x-emptyLabel: None
        description: The edge menu to open.
        x-showIf: {showPopout: true}
      backgroundColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: accent
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
