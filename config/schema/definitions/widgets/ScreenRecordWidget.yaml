# The ScreenRecordWidget definition (#/definitions/ScreenRecordWidget).

x-link: {setting: Screenshots}
type: object
x-icon: radio_button_checked
x-libraryGroup: Tools
required: [type]
additionalProperties: false
properties:
  type:
    const: ScreenRecord
    description: Screen Recording
  visible:
    type: boolean
  layout:
    $ref: '#/definitions/WidgetLayout'
  properties:
    type: object
    additionalProperties: false
    properties:
      showTimer:
        type: boolean
        title: Show time recorded
        default: true
      showPopout:
        type: boolean
        title: Menu popout
        default: false
        description: Open an edge menu when hovered.
      popoutMenu:
        type: string
        title: Menu
        default: ""
        x-options: edgeMenus
        x-emptyLabel: None
        description: The edge menu to open.
        x-showIf: {showPopout: true}
      activeColor:
        type: string
        title: Color
        x-options: colors
        default: ""
        x-emptyLabel: Auto
        x-autoColor: critical
        x-showIf:
          $bar.widgetStyle: {not: plain}
      foregroundColor:
        type: string
        title: Text color
        x-options: colors
        default: base00
        x-showIf:
          $bar.widgetStyle: filled
          $bar.widgetGrouping: {not: merged}
          $bar.widgetTextColor: ""
