# The FavouritesOverlayModule definition (#/definitions/FavouritesOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: star
x-libraryGroup: Tools
x-defaultSize: [4, 2]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: Favourites
    description: Favourite apps
  properties:
    type: object
    additionalProperties: false
    properties:
      apps:
        x-scope: personal
        type: array
        title: Apps
        default: []
        items:
          type: string
        description: Desktop entry ids, comma-separated (e.g. firefox, kitty). Empty shows recently launched apps.
      showLabels:
        type: boolean
        title: Show names
        default: true
