# The QuickActionsOverlayModule definition (#/definitions/QuickActionsOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: toggle_on
x-libraryGroup: Tools
x-defaultSize: [4, 2]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: QuickActions
    description: Quick actions
  properties:
    type: object
    additionalProperties: false
    properties:
      actions:
        type: array
        title: Actions
        default: [wifi, bluetooth, caffeine, dnd, darkMode]
        description: Toggles, session actions and pin, in any mix. Night light and power saver only show when hyprsunset/wlsunset or powerprofilesctl is installed, brightness only with a monitor brightnessctl or ddcutil can set (a tap opens every monitor's sliders), and pin only in an edge menu. Log out, reboot and power off ask for a second click.
        items:
          type: string
          enum:
            - wifi
            - bluetooth
            - caffeine
            - dnd
            - darkMode
            - nightLight
            - powerSaver
            - brightness
            - lock
            - suspend
            - hibernate
            - logout
            - reboot
            - poweroff
            - pin
      labels:
        type: string
        title: Names
        default: auto
        enum: [auto, show, hide]
        x-enumLabels: {auto: Auto, show: Show, hide: Hide}
        description: Auto shows the names only when every tile has room for its whole name.
      style:
        type: string
        title: Style
        default: tiles
        enum: [tiles, pills]
        x-enumLabels: {tiles: Tiles, pills: Pills}
        description: 'Pills are wide, with a status line beside the icon. Wi-Fi, Bluetooth and Do not disturb open their networks, devices or notifications over the menu or page: from beside a pill''s icon, or a tile''s right click or long press.'
