# The TopProcessesOverlayModule definition (#/definitions/TopProcessesOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: format_list_bulleted
x-libraryGroup: System
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: TopProcesses
    description: Top processes
  properties:
    type: object
    additionalProperties: false
    properties:
      count:
        type: integer
        x-control: stepper
        title: Processes
        default: 8
        minimum: 1
        maximum: 30
      sortBy:
        type: string
        title: Sort by
        default: cpu
        enum: [cpu, mem]
