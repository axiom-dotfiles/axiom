# The AudioMixerOverlayModule definition (#/definitions/AudioMixerOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: tune
x-libraryGroup: Media & audio
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: AudioMixer
    description: Audio mixer
  properties:
    type: object
    additionalProperties: false
    properties:
      grow:
        type: integer
        title: Grow by up to
        default: 0
        minimum: 0
        maximum: 16
        x-unit: rows
        description: 'Rows it may take while its list needs them: free rows towards the edge first (above it, or below it in a bottom menu), then away from it, pushing the modules there along (not on the lock or login screen). 0 keeps it at its size.'
      mode:
        type: string
        title: Start on
        default: output
        enum: [output, input]
