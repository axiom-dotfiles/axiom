# The AgendaOverlayModule definition (#/definitions/AgendaOverlayModule).

x-link: {setting: Calendar}
type: object
x-hosts: [overlay, edgeMenu, desktop]
x-keyboard: true
x-icon: event_note
x-libraryGroup: Time & weather
x-defaultSize: [4, 4]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: Agenda
    description: Agenda
  properties:
    type: object
    additionalProperties: false
    properties:
      grow:
        type: integer
        title: Grow by up to
        default: 0
        minimum: 0
        maximum: 16
        x-unit: rows
        description: 'Rows it may take while its list needs them: free rows towards the edge first (above it, or below it in a bottom menu), then away from it, pushing the modules there along (not on the lock or login screen). 0 keeps it at its size.'
      days:
        type: integer
        title: Days ahead
        default: 7
        minimum: 1
        maximum: 60
        description: Events from today through this many days.
      maxEvents:
        type: integer
        title: Most events
        default: 20
        minimum: 1
        maximum: 100
