# The WifiNetworksOverlayModule definition (#/definitions/WifiNetworksOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-keyboard: true
x-icon: wifi
x-libraryGroup: Network & devices
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: WifiNetworks
    description: Wi-Fi networks
  properties:
    type: object
    additionalProperties: false
    properties:
      grow:
        type: integer
        title: Grow by up to
        default: 0
        minimum: 0
        maximum: 16
        x-unit: rows
        description: 'Rows it may take while its list needs them: free rows towards the edge first (above it, or below it in a bottom menu), then away from it, pushing the modules there along (not on the lock or login screen). 0 keeps it at its size.'
