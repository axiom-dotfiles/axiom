    $ref: '#/definitions/GridPlace'
  type:
    const: ColorSwatch
    description: Theme color swatch
  properties:
    type: object
    additionalProperties: false
    properties:
      color:
        type: string
        title: Color
        default: base00
        x-options: colors
      label:
        type: string
        title: Label
        default: ""
        description: Secondary label, e.g. the semantic role.
