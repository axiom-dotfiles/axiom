# The CalculatorOverlayModule definition (#/definitions/CalculatorOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-keyboard: true
x-icon: calculate
x-libraryGroup: Tools
x-defaultSize: [4, 4]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: Calculator
    description: Calculator
  properties:
    type: object
    additionalProperties: false
    properties:
      showKeypad:
        type: boolean
        title: Show the keypad
        default: true
        description: Calculator keys under the field, when the card is tall enough.
      showHistory:
        type: boolean
        title: Show the history
        default: true
        description: 'Answers you copied or finished with =: below the field, or beside it in a wide card (beside the keypad there, else in its place), when there''s room.'
