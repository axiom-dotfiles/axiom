# The CheatsheetOverlayModule definition (#/definitions/CheatsheetOverlayModule).

x-link: {page: Keybinds}
type: object
x-hosts: [overlay, edgeMenu, desktop]
x-keyboard: true
x-icon: keyboard
x-libraryGroup: Tools
x-defaultSize: [8, 6]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: Cheatsheet
    description: Keybind cheat sheet
  properties:
    type: object
    additionalProperties: false
    properties:
      sections:
        type: array
        title: Sections
        default: []
        items:
          type: string
        description: Section titles to show, comma-separated (as on the Keybinds page). Empty shows them all.
      showUndescribed:
        type: boolean
        title: Show undescribed binds
        default: false
        description: Binds without a description, listed by their dispatcher.
      view:
        type: string
        title: View
        enum: [list, keyboard]
        x-enumLabels: {list: List, keyboard: Keyboard}
        default: list
        description: The binds by section, or a keyboard showing what each key does under the modifiers below.
      mods:
        type: array
        title: Keyboard modifiers
        default: [SUPER]
        items:
          type: string
          enum: [SUPER, CTRL, ALT, SHIFT]
        x-showIf: {view: keyboard}
        description: The modifiers held on the keyboard view.
