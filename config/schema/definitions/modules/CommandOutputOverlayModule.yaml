# The CommandOutputOverlayModule definition (#/definitions/CommandOutputOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: terminal
x-libraryGroup: Tools
x-defaultSize: [4, 2]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: CommandOutput
    description: Command output
  properties:
    type: object
    additionalProperties: false
    x-order: [title, icon, command, interval, monospace, clickCommand]
    properties:
      title:
        type: string
        title: Title
        default: ""
        description: Shown over the output. Empty shows the command when there's room.
      icon:
        type: string
        title: Icon
        default: terminal
        description: A Material Symbols name.
      command:
        x-scope: commands
        type: string
        title: Command
        x-multiline: true
        default: uptime -p
        description: Run with sh while the card is shown; its output is the card. One short line shows as a big figure.
      interval:
        type: integer
        title: Run every
        x-unit: s
        default: 10
        minimum: 1
        maximum: 86400
      monospace:
        type: boolean
        title: Monospace
        default: false
        description: For tables and aligned output (lines aren't wrapped).
      clickCommand:
        x-scope: commands
        type: string
        title: On click
        default: ""
        description: A command a click on the card runs (the command runs again after). Empty does nothing.
