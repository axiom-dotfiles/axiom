# The BrightnessOverlayModule definition (#/definitions/BrightnessOverlayModule).

type: object
x-hosts: [overlay, edgeMenu, desktop]
x-icon: brightness_medium
x-libraryGroup: System
x-defaultSize: [4, 1]
required: [type]
additionalProperties: false
properties:
  place:
    $ref: '#/definitions/GridPlace'
  type:
    const: Brightness
    description: Brightness
  properties:
    type: object
    additionalProperties: false
    properties:
      monitor:
        x-scope: machine
        type: string
        title: Monitor
        default: '*'
        x-options: screens
        x-allScreens: true
        description: Empty uses the primary monitor. All monitors sets every monitor at once, with a slider for each below where there's room.
