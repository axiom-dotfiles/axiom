# The ScreenLayout definition (#/definitions/ScreenLayout).

description: 'A screen of overlay modules on a bounded grid fitted to each monitor at the card size: the built-in lock screen (Lockscreen.layout) and the greeter (Greeter.layout).'
type: object
additionalProperties: false
x-order:
  - moduleScale
  - fineGrid
  - otherScreens
  - background
  - blurWallpaper
  - backgroundColor
  - dim
  - moduleBorders
  - passwordBorder
  - greetingBorder
properties:
  columns:
    type: integer
    x-settings: false
    default: 16
    minimum: 1
    maximum: 256
    description: Grid units across of the grid the modules were last placed on (written by the layouts editor). Each monitor fits its own grid at the card size, and modules keep to their nearest edge on it.
  rows:
    type: integer
    x-settings: false
    default: 9
    minimum: 1
    maximum: 256
    description: Grid units down of the grid the modules were last placed on.
  fineGrid:
    x-group: Grid
    type: boolean
    title: Double grid
    default: false
    description: Split each grid unit in two each way, for finer placement. Modules keep their size and spot.
  moduleScale:
    x-link: {setting: Widget.cardSize}
    x-group: Grid
    type: integer
    x-control: stepper
    title: Module size
    default: 100
    minimum: 50
    maximum: 200
    x-unit: '%'
    description: Size of the modules, relative to the card size in Look & Feel. Their text and content grow and shrink with them, and each monitor fits as many as its screen holds.
  otherScreens:
    x-group: Grid
    type: string
    title: Other monitors
    enum: [layout, background]
    x-enumLabels:
      layout: The same modules, without the password
      background: The background only
    default: layout
    description: What monitors other than the one with the password field show.
  background:
    x-group: Background
    type: string
    title: Background
    enum: [wallpaper, color]
    x-enumLabels: {wallpaper: Wallpaper, color: Color}
    default: wallpaper
    description: Each monitor's wallpaper, or a plain color.
  blurWallpaper:
    x-group: Background
    type: boolean
    title: Blur wallpaper
    default: true
    x-showIf: {background: wallpaper}
  backgroundColor:
    x-group: Background
    type: string
    title: Color
    x-options: colors
    default: base00
    x-showIf: {background: color}
  dim:
    x-group: Background
    type: integer
    title: Dim
    default: 40
    minimum: 0
    maximum: 100
    x-unit: '%'
    x-control: slider
    description: Darken the background so the modules stand out.
  moduleBorders:
    x-group: Style
    type: boolean
    title: Module borders
    default: true
    description: Draw each module's card box. Off shows modules straight on the background. The password field and the greeting have their own switches.
  passwordBorder:
    x-group: Style
    type: boolean
    title: Password field border
    default: false
    description: Draw a card box around the password field.
  greetingBorder:
    x-group: Style
    type: boolean
    title: Greeting border
    default: false
    description: Draw a card box around the greeting.
  modules:
    type: array
    x-settings: false
    default: []
    items:
      $ref: '#/definitions/OverlayModule'
