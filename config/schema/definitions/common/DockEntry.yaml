# The DockEntry definition (#/definitions/DockEntry).

type: object
additionalProperties: false
x-order:
  - name
  - enabled
  - monitors
  - monitor
  - edge
  - position
  - detached
  - gap
  - visibility
  - reserveSpace
  - openDelay
  - closeDelay
  - triggerSize
  - iconSize
  - spacing
  - padding
  - magnify
  - magnifiedSize
  - magnifyRange
  - showRunning
  - windowScope
  - runningIndicator
  - separator
  - showLabels
  - backgroundColor
  - borderColor
properties:
  id:
    type: string
    title: ID
    default: main
    x-settings: false
  name:
    type: string
    title: Name
    default: ""
    description: Shown on its tab here. Empty names it by its edge.
  enabled:
    type: boolean
    title: Enabled
    default: true
  monitors:
    x-link: {setting: General.monitors}
    type: string
    title: Monitors
    enum: [general, primary, focused, all, monitor]
    x-enumLabels:
      general: As in General
      primary: Primary monitor
      focused: Focused monitor
      all: Every monitor
      monitor: A specific monitor
    default: general
    description: Where the dock appears. As in General follows General > Monitors; the primary monitor is the one set in General; the focused monitor is the one with your active workspace (and mouse), and the dock moves with it; every monitor shows it on all of them at once; a specific monitor is the one picked below.
  monitor:
    x-monitorRef: "off"
    x-scope: machine
    type: string
    title: Monitor
    default: ""
    description: Monitor the dock is shown on. Empty uses the primary monitor.
    x-options: screens
    x-showIf: {monitors: monitor}
  edge:
    type: string
    title: Screen edge
    default: Bottom
    enum: [Top, Bottom, Left, Right]
  position:
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where along the edge its centre sits: 0 is the start (left/top), 100 the end. It never runs off the screen.'
  detached:
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box held off the edge. Off, the dock grows out of the screen border or a solid bar, as popouts do, and runs straight off a bare screen edge.
  gap:
    type: integer
    x-control: stepper
    x-auto: {value: -1, start: 8}
    x-beside: true
    title: Gap
    default: -1
    minimum: -1
    maximum: 200
    x-unit: px
    description: Space between the dock and the border or bar on its edge, and at the ends. Auto lines it up with a floating bar on its edge, else with your windows. Reserving its space, it keeps the compositor's gap between windows from them.
    x-showIf: {detached: true}
  visibility:
    type: string
    title: Visibility
    default: always
    enum: [always, hover, intellihide]
    x-enumLabels:
      always: Always shown
      hover: Show on hover
      intellihide: Hide when a window overlaps
    description: Always shown stays up. Show on hover slides in when the pointer rests on the screen edge. Hide when a window overlaps stays up until a window on the monitor's workspace covers it, then works like Show on hover.
  reserveSpace:
    type: boolean
    title: Reserve space
    default: true
    x-showIf: {visibility: always}
    description: Keep windows out of the dock's strip, as a bar does. Magnified icons still grow over windows.
  openDelay:
    type: integer
    title: Open delay
    default: 150
    minimum: 0
    maximum: 2000
    x-unit: ms
    x-showIf:
      visibility: [hover, intellihide]
    description: How long the pointer rests on the edge before the dock slides in.
  closeDelay:
    type: integer
    title: Close delay
    default: 400
    minimum: 0
    maximum: 5000
    x-unit: ms
    x-showIf:
      visibility: [hover, intellihide]
    description: How long after the pointer leaves the dock it slides away.
  triggerSize:
    type: integer
    x-control: stepper
    title: Trigger size
    default: 4
    minimum: 1
    maximum: 50
    x-unit: px
    x-showIf:
      visibility: [hover, intellihide]
    description: How far in from the screen edge the hover strip reaches.
  iconSize:
    type: integer
    title: Icon size
    default: 48
    minimum: 16
    maximum: 128
    x-unit: px
  spacing:
    type: integer
    x-control: stepper
    title: Icon spacing
    default: 6
    minimum: 0
    maximum: 48
    x-unit: px
  padding:
    type: integer
    x-control: stepper
    title: Padding
    default: 8
    minimum: 0
    maximum: 48
    x-unit: px
    description: Space between the dock's box and its icons.
  magnify:
    type: boolean
    title: Magnify under the pointer
    default: false
    description: Grow the icons near the pointer, as macOS does.
  magnifiedSize:
    type: integer
    title: Magnified size
    default: 80
    minimum: 16
    maximum: 256
    x-unit: px
    x-showIf: {magnify: true}
    description: Size of the icon right under the pointer.
  magnifyRange:
    type: integer
    x-control: stepper
    title: Magnify range
    default: 3
    minimum: 1
    maximum: 8
    x-showIf: {magnify: true}
    description: How many icons to each side of the pointer grow with it.
  showRunning:
    type: boolean
    title: Show running apps
    default: true
    description: Also show apps with open windows that aren't pinned, after the pinned ones.
  windowScope:
    type: string
    title: Windows counted
    default: all
    enum: [all, monitor, workspace]
    x-enumLabels:
      all: Every window
      monitor: Windows on this monitor
      workspace: Windows on this monitor's workspace
    description: 'Which windows make an app running here: its indicator, what a click focuses, and the running apps shown.'
  runningIndicator:
    type: string
    title: Running indicator
    default: dots
    enum: [dots, line, none]
    x-enumLabels: {dots: A dot per window (up to 3), line: A line, none: None}
  separator:
    type: boolean
    title: Separator
    default: true
    description: A line between the pinned apps and the other running ones.
    x-showIf: {showRunning: true}
  showLabels:
    type: boolean
    title: Names on hover
    default: true
    description: Show an app's name in a tooltip when the pointer rests on it.
  backgroundColor:
    type: string
    title: Background
    x-options: colors
    default: base00
  borderColor:
    type: string
    title: Border
    x-options: colors
    default: base05
  pinnedOwn:
    type: boolean
    title: Own pinned apps
    x-settings: false
    default: false
    description: The dock shows its own pinned apps (pinned) instead of Apps → pinned, the list every other dock shares.
  pinned:
    x-scope: personal
    type: array
    title: Pinned apps
    x-settings: false
    default: []
    items:
      type: string
    description: 'Desktop entry ids, in order: the dock''s own, shown with pinnedOwn.'
