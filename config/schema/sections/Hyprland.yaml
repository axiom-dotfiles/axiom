# The Hyprland section of the config (config.json's "Hyprland").

type: object
x-category: Compositor
x-showIf: {/$compositor: hyprland, /Compositor.mode: managed}
title: Hyprland
description: Hyprland's own options, written while axiom manages its config. Needs Hyprland 0.55+ with a Lua config.
additionalProperties: false
properties:
  managed:
    x-scope: personal
    type: object
    title: Managed config
    description: Written into hyprland.lua. Anything else goes in ~/.config/hypr/user/*.lua.
    additionalProperties: false
    x-order:
      - layout
      - preserveSplit
      - smartSplit
      - smartResizing
      - forceSplit
      - splitRatio
      - masterSize
      - masterOrientation
      - masterNewStatus
      - snap
      - dimSpecial
      - animations
      - animationPreset
      - workspaceWraparound
      - curves
      - customAnimations
      - floatSwitchOverrideFocus
      - resizeOnBorder
      - hideLogo
      - backgroundThemed
      - backgroundColor
      - swallow
      - swallowRegex
      - closeSpecialOnEmpty
      - hideSpecialOnWorkspaceChange
      - mouseWakesScreen
      - keyWakesScreen
      - vrr
      - scrollEventDelay
      - xwaylandZeroScaling
    properties:
      layout:
        x-link: {setting: Workspaces}
        type: string
        title: Layout
        x-group: Hyprland layout
        enum: [dwindle, master]
        x-enumLabels: {dwindle: Dwindle (binary splits), master: Master and stack}
        default: dwindle
        description: How windows tile. For strips (Hyprland's scrolling columns), see Workspaces.
        x-hypr: general.layout
        x-hyprAlways: true
      preserveSplit:
        type: boolean
        title: Keep split direction
        x-group: Hyprland layout
        default: true
        description: Dwindle keeps a split's direction when the window is resized or moved.
        x-showIf: {layout: dwindle}
        x-hypr: dwindle.preserve_split
        x-hyprAlways: true
      smartSplit:
        type: boolean
        title: Split by cursor position
        x-group: Hyprland layout
        default: false
        description: Dwindle splits towards the side of the window the cursor is on.
        x-showIf: {layout: dwindle}
        x-hypr: dwindle.smart_split
      smartResizing:
        type: boolean
        title: Resize by cursor position
        x-group: Hyprland layout
        default: true
        description: Resizing moves the edge nearest the cursor.
        x-showIf: {layout: dwindle}
        x-hypr: dwindle.smart_resizing
      forceSplit:
        type: string
        title: New windows go
        x-group: Hyprland layout
        enum: ["0", "1", "2"]
        x-enumLabels: {"0": Towards the cursor, "1": Left or above, "2": Right or below}
        default: "0"
        x-showIf: {layout: dwindle}
        x-hypr: dwindle.force_split
        x-hyprValue: number
      splitRatio:
        type: integer
        title: Split ratio
        x-unit: '%'
        x-group: Hyprland layout
        default: 100
        minimum: 10
        maximum: 190
        description: The first window's share of a new split; 100 splits evenly.
        x-showIf: {layout: dwindle}
        x-hypr: dwindle.default_split_ratio
        x-hyprScale: 0.01
      masterSize:
        type: integer
        title: Master size
        x-unit: '%'
        x-group: Hyprland layout
        default: 55
        minimum: 5
        maximum: 95
        x-showIf: {layout: master}
        x-hypr: master.mfact
        x-hyprScale: 0.01
      masterOrientation:
        type: string
        title: Master side
        x-group: Hyprland layout
        enum: [left, right, top, bottom, center]
        default: left
        x-showIf: {layout: master}
        x-hypr: master.orientation
      masterNewStatus:
        type: string
        title: New windows become
        x-group: Hyprland layout
        enum: [slave, master, inherit]
        x-enumLabels:
          slave: Part of the stack
          master: The master
          inherit: Like the focused window
        default: slave
        x-showIf: {layout: master}
        x-hypr: master.new_status
      snap:
        type: boolean
        title: Snap floating windows
        x-group: Hyprland layout
        default: false
        description: Floating windows snap to each other and the screen edges.
        x-hypr: general.snap.enabled
      dimSpecial:
        x-scope: look
        type: integer
        title: Dim behind special workspaces
        x-unit: '%'
        x-group: Hyprland behaviour
        default: 20
        minimum: 0
        maximum: 100
        x-hypr: decoration.dim_special
        x-hyprScale: 0.01
      animations:
        x-scope: look
        type: boolean
        title: Animations
        x-group: Hyprland animations
        default: true
        x-hypr: animations.enabled
        x-hyprAlways: true
      animationPreset:
        x-link: {setting: Appearance.motion}
        x-scope: look
        type: string
        title: Style
        x-group: Hyprland animations
        enum:
          - hyprland
          - axiom
          - instant
          - snappy
          - bouncy
          - lightning
          - custom
        x-enumLabels:
          hyprland: Hyprland's defaults
          axiom: Follow axiom's motion
          instant: Instant
          snappy: Snappy
          bouncy: Bouncy
          lightning: Lightning
          custom: Custom
        default: axiom
        description: Follow axiom's motion uses Look & Feel → Motion's speed, and turns Hyprland's animations off with axiom's.
        x-showIf: {animations: true}
      workspaceWraparound:
        type: boolean
        title: Wrap workspace animations
        x-group: Hyprland animations
        default: false
        description: Going from the last workspace to the first slides forward, not back.
        x-showIf: {animations: true}
        x-hypr: animations.workspace_wraparound
      curves:
        x-scope: look
        x-wide: true
        type: array
        title: Curves
        x-group: Hyprland animations
        default: []
        description: Named bezier curves for the custom animations.
        x-showIf: {animationPreset: custom}
        items:
          type: object
          additionalProperties: false
          x-order: [name, points]
          properties:
            name:
              type: string
              title: Name
              default: ""
            points:
              type: string
              title: Points
              default: "0.25, 0.1, 0.25, 1"
              description: x1, y1, x2, y2, as in CSS cubic-bezier().
      customAnimations:
        x-scope: look
        type: array
        title: Animations
        x-group: Hyprland animations
        default: []
        description: One entry per animation to change; a parent (windows) covers its children (windowsIn, windowsOut, windowsMove).
        x-showIf: {animationPreset: custom}
        items:
          type: object
          additionalProperties: false
          x-order: [leaf, enabled, durationMs, curve, style]
          properties:
            leaf:
              type: string
              title: Animation
              enum:
                - global
                - windows
                - windowsIn
                - windowsOut
                - windowsMove
                - layers
                - layersIn
                - layersOut
                - fade
                - fadeIn
                - fadeOut
                - fadeSwitch
                - fadeShadow
                - fadeDim
                - border
                - borderangle
                - workspaces
                - workspacesIn
                - workspacesOut
                - specialWorkspace
                - specialWorkspaceIn
                - specialWorkspaceOut
                - zoomFactor
                - monitorAdded
              default: windows
            enabled:
              type: boolean
              title: "On"
              default: true
            durationMs:
              type: integer
              title: Duration
              x-unit: ms
              default: 300
              minimum: 10
              maximum: 5000
            curve:
              type: string
              title: Curve
              default: default
              description: A curve's name from above, or default.
            style:
              type: string
              title: Style
              default: ""
              description: 'Optional: popin 80%, slide, slidevert, slidefade 20%, fade, gnomed, loop, once.'
      floatSwitchOverrideFocus:
        type: string
        title: Crossing tiled/floating
        x-group: Hyprland windows
        enum: ["0", "1", "2"]
        x-enumLabels:
          "0": Leaves focus alone
          "1": Moves focus
          "2": Moves focus, also floating to floating
        default: "1"
        description: What moving the cursor between tiled and floating windows does.
        x-showIf: {/WindowBehaviour.followMouse: true}
        x-hypr: input.float_switch_override_focus
        x-hyprValue: number
      resizeOnBorder:
        type: boolean
        title: Resize by dragging borders
        x-group: Hyprland windows
        default: true
        x-hypr: general.resize_on_border
        x-hyprAlways: true
      hideLogo:
        x-scope: look
        type: boolean
        title: Hide Hyprland's logo and splash
        x-group: Hyprland behaviour
        default: true
        x-hypr: [misc.disable_hyprland_logo, misc.disable_splash_rendering]
        x-hyprAlways: true
      backgroundThemed:
        x-scope: look
        type: boolean
        title: Background in a theme color
        x-group: Hyprland behaviour
        default: false
        description: What shows where there's no wallpaper.
      backgroundColor:
        x-scope: look
        type: string
        title: Background color
        x-group: Hyprland behaviour
        x-options: colors
        default: base00
        x-showIf: {backgroundThemed: true}
        x-hypr: misc.background_color
        x-hyprValue: color
        x-hyprIf: backgroundThemed
      swallow:
        type: boolean
        title: Terminals swallow what they open
        x-group: Hyprland behaviour
        default: true
        description: A GUI app started from a terminal takes the terminal's place until it closes.
        x-hypr: misc.enable_swallow
        x-hyprAlways: true
      swallowRegex:
        type: string
        title: Swallowing terminals
        x-group: Hyprland behaviour
        default: ^(kitty|foot|Alacritty|com\.mitchellh\.ghostty|org\.wezfurlong\.wezterm)$
        description: A regex of terminal window classes.
        x-showIf: {swallow: true}
        x-hypr: misc.swallow_regex
        x-hyprIf: swallow
      closeSpecialOnEmpty:
        type: boolean
        title: Close empty special workspaces
        x-group: Hyprland behaviour
        default: true
        x-hypr: misc.close_special_on_empty
      hideSpecialOnWorkspaceChange:
        type: boolean
        title: Hide special workspaces on switching
        x-group: Hyprland behaviour
        default: false
        x-hypr: binds.hide_special_on_workspace_change
      mouseWakesScreen:
        x-scope: machine
        type: boolean
        title: Mouse wakes the screen
        x-group: Hyprland behaviour
        default: true
        x-hypr: misc.mouse_move_enables_dpms
        x-hyprAlways: true
      keyWakesScreen:
        x-scope: machine
        type: boolean
        title: Keys wake the screen
        x-group: Hyprland behaviour
        default: false
        x-hypr: misc.key_press_enables_dpms
      vrr:
        x-scope: machine
        type: string
        title: Variable refresh rate
        x-group: Hyprland behaviour
        enum: ["0", "1", "2"]
        x-enumLabels: {"0": "Off", "1": "On", "2": Fullscreen only}
        default: "0"
        x-hypr: misc.vrr
        x-hyprValue: number
      scrollEventDelay:
        x-scope: machine
        type: integer
        title: Scroll bind delay
        x-unit: ms
        x-group: Hyprland behaviour
        default: 300
        minimum: 0
        maximum: 2000
        description: How long a bound scroll ignores further scrolling.
        x-hypr: binds.scroll_event_delay
      xwaylandZeroScaling:
        x-scope: machine
        type: boolean
        title: Unscaled X11 apps
        x-group: Hyprland behaviour
        default: true
        description: X11 apps draw at native resolution on scaled monitors, instead of blurry.
        x-hypr: xwayland.force_zero_scaling
        x-hyprAlways: true
