# The Greeter section of the config (config.json's "Greeter").

type: object
x-category: Screen & Power
x-card: GreeterStatus
x-cardTitle: greetd
x-links: ['Layouts:greeter']
title: Login screen
description: 'Axiom as your login screen (a greetd greeter), laid out on the Layouts page like the lock screen. It runs as greetd''s own user from a copy of axiom installed for it, and shows what axiom exports for it here: no root is needed to change it once it''s set up.'
additionalProperties: false
x-order: [source, monitor, rememberUser]
properties:
  enabled:
    type: boolean
    x-takeover: true
    x-settings: false
    default: false
    description: Set up as the login screen (set by its card's Install and Remove, never by hand).
  source:
    type: string
    title: Code from
    x-showIf: {/$packaged: false}
    enum: [git, local]
    x-enumLabels: {git: Git (axiom's repository), local: Local (your clone)}
    default: git
    description: 'Where Install and Update take the login screen''s code. Git fetches it as root from the repository axiom was installed from, following releases or main as axiom''s updates do: nothing that can write to your clone can change it. Local copies your clone as it is (the checked-out branch, uncommitted changes included), for working on axiom: any program running as you could change what the login screen runs before you next update it.'
  monitor:
    type: string
    title: Login monitor
    x-options: screens
    default: ""
    description: The monitor the login box shows on. The others show the layout without it, or only the background.
  rememberUser:
    type: boolean
    title: Remember the last user
    default: true
    description: Start on whoever logged in last, and on their last session. Off starts with an empty user field.
  layout:
    x-scope: look
    $ref: '#/definitions/ScreenLayout'
    x-settings: false
    title: Login screen
    description: 'What the login screen shows, edited on the Layouts page: its modules on a grid of columns × rows units, fitted to each monitor.'
    default:
      modules:
        - type: ClockCalendar
          place: {x: 0, "y": 0, w: 4, h: 2}
        - type: Greeting
          place: {x: 4, "y": 2, w: 8, h: 2}
        - type: Login
          place: {x: 5, "y": 4, w: 6, h: 3}
        - type: Session
          place: {x: 6, "y": 7, w: 4, h: 1}
        - type: KeyboardLayout
          place: {x: 0, "y": 8, w: 2, h: 1}
        - type: Power
          place: {x: 13, "y": 8, w: 3, h: 1}
