# The Pomodoro section of the config (config.json's "Pomodoro").

type: object
x-category: Modules
x-scope: personal
title: Pomodoro timer
description: Focus sessions and breaks, shared by every pomodoro widget and module.
additionalProperties: false
x-order:
  - workMinutes
  - shortBreakMinutes
  - longBreakMinutes
  - longBreakEvery
  - autoStartBreaks
  - autoStartWork
  - notify
properties:
  workMinutes:
    type: integer
    title: Focus session
    x-unit: min
    default: 25
    minimum: 1
    maximum: 180
  shortBreakMinutes:
    type: integer
    title: Short break
    x-unit: min
    default: 5
    minimum: 1
    maximum: 60
  longBreakMinutes:
    type: integer
    title: Long break
    x-unit: min
    default: 15
    minimum: 1
    maximum: 120
  longBreakEvery:
    type: integer
    title: Long break every
    x-unit: sessions
    default: 4
    minimum: 1
    maximum: 12
    description: A long break follows this many focus sessions.
  autoStartBreaks:
    type: boolean
    title: Start breaks by themselves
    default: true
  autoStartWork:
    type: boolean
    title: Start focus sessions by themselves
    default: false
    description: Off, a break ends waiting for you to start the next session.
  notify:
    type: boolean
    title: Notify
    default: true
    description: A notification when a session or break ends.
