# Given back by axiom when it stopped managing sway: this file is yours now,
# and axiom won't write it again. It starts axiom and includes
# /nonexistent/home/.config/sway/user/, as axiom's managed one did.
include /nonexistent/home/.local/state/axiom/sway.conf
exec '/home/user/.local/bin/axiom' run

include /nonexistent/home/.config/sway/user/*
